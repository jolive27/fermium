[package]
name = "fermium-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true

# The language server (fermium lsp): JSON-RPC over stdin/stdout with a small JSON reader and writer of its own
# (json.rs), so it needs no other crate.
[dependencies]
fermium-syntax = { path = "../fermium-syntax" }
fermium-check = { path = "../fermium-check" }
fermium-fmt = { path = "../fermium-fmt" }
fermium-ir = { path = "../fermium-ir" }
fermium-units = { path = "../fermium-units" }
