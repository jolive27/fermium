[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "MIT"
authors = ["John Oliver"]

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 1

# the browser playground's module (web/build.py: cargo build --profile wasm --target wasm32-unknown-unknown
# -p fermium-wasm): whole-program LTO and no symbol names, for a smaller download
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# the run time of executables made by `fermium build` (fermium-aotrt), built by fermium-cli's build.rs in a
# folder of its own
[profile.aotrt]
inherits = "release"
lto = false
codegen-units = 16

# for iterating: release speed without LTO (cargo build --profile fast → target/fast/fermium)
[profile.fast]
inherits = "release"
lto = false
codegen-units = 64
incremental = true
