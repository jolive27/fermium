[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "MIT"
authors = ["John Oliver"]

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 1

# for iterating: release speed without LTO (cargo build --profile fast → target/fast/fermium)
[profile.fast]
inherits = "release"
lto = false
codegen-units = 64
incremental = true
