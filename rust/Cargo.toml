[workspace]
resolver = "2"
members = ["crates/*"]
# the shared libraries (the Python API, the playground's module) are built on their own (cargo build -p ...):
# built together with fermium-cli, feature unification would turn on fermium-codegen's LLVM back end in them, and
# LLVM's static, non-PIC system libraries (terminfo) can't go into a shared library
default-members = ["crates/fermium-aotrt", "crates/fermium-check", "crates/fermium-cli", "crates/fermium-codegen",
                   "crates/fermium-fmt", "crates/fermium-ir", "crates/fermium-jupyter", "crates/fermium-lsp",
                   "crates/fermium-repl", "crates/fermium-runtime", "crates/fermium-sym", "crates/fermium-syntax",
                   "crates/fermium-units"]

[workspace.package]
version = "2.5.0"
edition = "2021"
license = "MIT"
authors = ["John Oliver"]

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 1

# the browser playground's module (web/build.py: cargo build --profile wasm --target wasm32-unknown-unknown
# -p fermium-wasm): whole-program LTO and no symbol names, for a smaller download
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# the run time of executables made by `fermium build` (fermium-aotrt), built by fermium-cli's build.rs in a
# folder of its own
[profile.aotrt]
inherits = "release"
lto = false
codegen-units = 16

# for iterating: release speed without LTO (cargo build --profile fast → target/fast/fermium)
[profile.fast]
inherits = "release"
lto = false
codegen-units = 64
incremental = true
