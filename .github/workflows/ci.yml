name: CI

# GitHub Actions minutes are limited on this private repo and macOS minutes count 10x:
# Linux runs on every push; macOS only on pull requests and when started by hand (Actions tab → CI → Run workflow).
on:
  push:
    branches-ignore: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run on macOS (arm64)"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Fermium 2 (the Rust binary in rust/) is `fermium` since v2.0. Fermium 1.5 (Python, legacy/) is deprecated but
# stays in CI for one more phase (spec §B8, DECISIONS D269): it is the conformance oracle.
jobs:
  # Fermium 1.5 (legacy, deprecated): make check without its Rust part (FERMIUM_SKIP_RUST=1: the rust-linux job
  # builds and tests the Rust compiler and runs the conformance suite against it).
  linux:
    name: legacy (Fermium 1.5, deprecated), Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Fermium 1.5 (legacy; the console script is fermium-legacy)
        run: python3 -m pip install -e ".[full,dev]"
      - run: fermium-legacy doctor
      - name: Julia packages for the rosetta comparisons (if the runner has Julia)
        run: if command -v julia >/dev/null; then julia -e 'using Pkg; Pkg.add(["Unitful", "QuadGK"])'; fi
      - name: make check (legacy part; the Rust part runs in rust-linux)
        run: make check
        env:
          FERMIUM_SKIP_RUST: "1"

  rust-linux:
    name: Fermium 2 (Rust), Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-linux-${{ hashFiles('rust/Cargo.lock') }}
      - name: LLVM 18 static libraries and lld (rust/BUILD.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev lld-18 liblld-18-dev libzstd-dev zlib1g-dev libncurses-dev libpolly-18-dev || \
            (wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc && \
             sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main" && \
             sudo apt-get update && sudo apt-get install -y llvm-18-dev lld-18 liblld-18-dev libzstd-dev zlib1g-dev libncurses-dev libpolly-18-dev)
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: Build and test the Rust compiler
        working-directory: rust
        run: cargo build --profile fast && cargo test --profile fast && ldd target/fast/fermium && cargo build --profile fast -p fermium-pyapi -p fermium-wasm && cargo test --profile fast -p fermium-pyapi -p fermium-wasm
      - run: rust/target/fast/fermium doctor
      - name: Browser playground (the compiler as WebAssembly; every example must print what fermium run prints)
        run: |
          rustup target add wasm32-unknown-unknown
          python3 web/build.py
          node web/test/compare_native.js --bin rust/target/fast/fermium
      - name: Install v1.5 (the oracle) for the conformance runner
        run: python3 -m pip install -e ".[full,dev]"
      - name: Conformance, legacy (must be 100%)
        # the goldens come from OpenBLAS's SkylakeX kernels; other kernels change rounding noise in a few cases
        run: |
          if grep -q avx512f /proc/cpuinfo; then
            OPENBLAS_CORETYPE=SkylakeX python3 conformance/run --impl legacy --out conformance-legacy.md
          else
            echo "no AVX-512 on this runner: the BLAS-kernel-dependent cases in conformance/blas_sensitive.txt are skipped"
            python3 conformance/run --impl legacy --out conformance-legacy.md --skip-file conformance/blas_sensitive.txt
          fi
      - name: "Conformance, Rust (ratchet: never below conformance/RUST_FLOOR)"
        run: python3 conformance/run --impl rust --bin rust/target/fast/fermium --out conformance-rust.md --min "$(cat conformance/RUST_FLOOR)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: conformance-*.md

  # macOS jobs (Python and Rust): only on pull requests and hand-started runs, never on plain pushes (macOS minutes
  # count 10x on this private repo). The legacy job runs make check (its legacy part), which runs every program the
  # conformance suite was harvested from (tests, examples, rosetta, gauntlet, research), so the legacy conformance
  # run is Linux only.
  macos:
    name: legacy (Fermium 1.5, deprecated), macOS
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Fermium 1.5 (legacy; the console script is fermium-legacy)
        run: python3 -m pip install -e ".[full,dev]"
      - run: fermium-legacy doctor
      - name: make check (legacy part; the Rust part runs in rust-macos)
        run: make check
        env:
          FERMIUM_SKIP_RUST: "1"

  # The Rust compiler on macOS arm64. A separate job with the same gate as `macos`, so the two run side by side
  # (the same minutes, half the wall time, and neither hits its timeout). It runs the whole conformance suite
  # (about 12 minutes on the runner's 3 cores), not a subset.
  rust-macos:
    name: Fermium 2 (Rust), macOS
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-macos-${{ hashFiles('rust/Cargo.lock') }}
      - name: LLVM 18 static libraries and lld from Homebrew (rust/BUILD.md)
        run: |
          brew install llvm@18 zstd
          # lld's static libraries ship with llvm@18, or in newer Homebrew in the separate lld@18 formula
          # (fermium-codegen/build.rs looks in LLD_PREFIX too)
          if brew install lld@18; then echo "LLD_PREFIX=$(brew --prefix lld@18)" >> "$GITHUB_ENV"; fi
          echo "LLVM_SYS_180_PREFIX=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"
      - name: Build and test the Rust compiler
        working-directory: rust
        # the default members first, then the shared libraries on their own (see rust/Cargo.toml default-members)
        run: cargo build --profile fast && cargo test --profile fast --no-fail-fast && otool -L target/fast/fermium && cargo build --profile fast -p fermium-pyapi -p fermium-wasm && cargo test --profile fast -p fermium-pyapi -p fermium-wasm
      - run: rust/target/fast/fermium doctor
      - name: NumPy and SciPy for the use-python cases (the versions the goldens were made with)
        run: python3 -m pip install numpy scipy -c conformance/oracle-constraints.txt
      - name: "Conformance, Rust (ratchet: never below conformance/RUST_FLOOR)"
        run: python3 conformance/run --impl rust --bin rust/target/fast/fermium --out conformance-rust-macos.md --min "$(cat conformance/RUST_FLOOR)" --skip-file conformance/libm_sensitive.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-macos
          path: conformance-rust-macos.md
