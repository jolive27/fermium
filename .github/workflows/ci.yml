name: CI

# GitHub Actions minutes are limited on this private repo and macOS minutes count 10x:
# Linux runs on every push; macOS only on pull requests and when started by hand (Actions tab → CI → Run workflow).
on:
  push:
    branches-ignore: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run on macOS (arm64)"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (fresh, as a tester would)
        run: python3 -m pip install -e ".[full,dev]"
      - run: fermium doctor
      - name: make check
        run: make check

  macos:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.macos)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (fresh, as a tester would)
        run: python3 -m pip install -e ".[full,dev]"
      - run: fermium doctor
      - name: make check
        run: make check
