[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fermium"
version = "0.1.0"
description = "Fermium 1.5, the deprecated Python implementation of Fermium (the language is now the Rust binary in rust/; see legacy/README.md)."
readme = "legacy/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "llvmlite>=0.44",
    "numpy>=1.24",
    "scipy>=1.11",
    "sympy>=1.12",
    "mpmath>=1.3",
    "matplotlib>=3.7",
    "pillow>=9",
    "ipykernel>=6",
    "jupyter_client>=8",
    "pygls>=2,<3",
    "lsprotocol",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
full = []  # the documented install is `pip install -e ".[full]"` (D234); every runtime dependency is already in core
jupyter = ["jupyterlab"]
dev = ["pytest", "pytest-cov", "pytest-xdist", "hypothesis", "ruff", "nbformat", "nbclient", "uncertainties", "pyyaml"]

# Fermium 2 (the Rust binary) is `fermium`; this package installs Fermium 1.5 as `fermium-legacy` (and
# `python3 -m fermium`), kept for the conformance oracle and the legacy test suite (DECISIONS D269).
[project.scripts]
fermium-legacy = "fermium.cli:entry"

[tool.setuptools]
packages = ["fermium", "fermium.runtime", "fermium.jupyter", "fermium.selfhost"]
package-dir = {"" = "legacy"}   # the v1 sources live in legacy/fermium; the import name stays `fermium`

[tool.setuptools.package-data]
"fermium.runtime" = ["*.c"]
"fermium" = ["stdlib/*.fm"]
"fermium.selfhost" = ["*.fm"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.pytest.ini_options]
testpaths = ["legacy/tests"]
